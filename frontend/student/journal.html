<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal & Community - MindWell</title>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#FAF8F5] text-stone-800 font-['Nunito',sans-serif]">

    <div id="notification" class="fixed top-5 right-5 z-[100] px-6 py-3 rounded-xl text-white font-bold opacity-0 transition-opacity"></div>

    <div class="min-h-screen flex flex-col relative overflow-hidden">
        
        <!-- Decorative blur blobs -->
        <div class="fixed top-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-amber-100 rounded-full blur-[100px] opacity-40 pointer-events-none z-0"></div>
        <div class="fixed bottom-[-10%] left-[-5%] w-[30vw] h-[30vw] bg-orange-100 rounded-full blur-[100px] opacity-40 pointer-events-none z-0"></div>

        <div id="global-header"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto p-6 md:p-8 relative z-10">
            <div class="container mx-auto max-w-7xl">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    
                    <!-- LEFT COLUMN: Write Entry -->
                    <div class="lg:col-span-7">
                        <div class="bg-white/60 backdrop-blur-xl p-8 rounded-3xl shadow-sm border border-white relative overflow-hidden">
                            <h1 class="text-3xl font-bold text-stone-800 mb-2 font-['Lora',serif]">Write an Entry</h1>
                            <p class="text-stone-500 mb-8">Share your thoughts with the community, or keep them to your followers.</p>
                            
                            <form id="journal-form">
                                <div class="mb-5">
                                    <label for="journal-title" class="block text-stone-700 font-bold mb-2">Title</label>
                                    <input type="text" id="journal-title" class="w-full p-4 bg-white/50 backdrop-blur border border-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[#789c8a] transition" placeholder="Give your entry a title..." required>
                                </div>
                                
                                <div class="mb-6">
                                    <label class="block text-stone-700 font-bold mb-3">Visibility <span class="text-red-500">*</span></label>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        
                                        <!-- Public Card -->
                                        <label class="relative cursor-pointer">
                                            <input type="radio" name="visibility" value="public" id="vis-public" class="peer sr-only" checked>
                                            <div class="p-4 rounded-xl border-2 border-[#F0EBE1] bg-white/50 backdrop-blur transition-all peer-checked:border-orange-500 peer-checked:bg-orange-50/50 hover:border-orange-200">
                                                <div class="flex items-center justify-between mb-1">
                                                    <div class="flex items-center gap-2 text-stone-800 font-bold">
                                                        <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                        Public
                                                    </div>
                                                    <div class="w-4 h-4 rounded-full border-2 border-stone-300 peer-checked:border-orange-500 flex items-center justify-center">
                                                        <div class="w-2 h-2 rounded-full bg-orange-500 opacity-0 peer-checked:opacity-100 transition-opacity"></div>
                                                    </div>
                                                </div>
                                                <p class="text-xs text-stone-500">Shared with the entire community feed.</p>
                                            </div>
                                        </label>

                                        <!-- Private Card -->
                                        <label class="relative cursor-pointer">
                                            <input type="radio" name="visibility" value="private" id="vis-private" class="peer sr-only">
                                            <div class="p-4 rounded-xl border-2 border-[#F0EBE1] bg-white/50 backdrop-blur transition-all peer-checked:border-stone-800 peer-checked:bg-stone-50 hover:border-stone-300">
                                                <div class="flex items-center justify-between mb-1">
                                                    <div class="flex items-center gap-2 text-stone-800 font-bold">
                                                        <svg class="w-5 h-5 text-stone-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                                        Followers Only
                                                    </div>
                                                    <div class="w-4 h-4 rounded-full border-2 border-stone-300 peer-checked:border-stone-800 flex items-center justify-center">
                                                        <div class="w-2 h-2 rounded-full bg-stone-800 opacity-0 peer-checked:opacity-100 transition-opacity"></div>
                                                    </div>
                                                </div>
                                                <p class="text-xs text-stone-500">Only approved followers can see this.</p>
                                            </div>
                                        </label>

                                    </div>
                                </div>

                                <div class="mb-6">
                                    <label for="journal-entry" class="block text-stone-700 font-bold mb-2">Your Thoughts</label>
                                    <textarea id="journal-entry" rows="8" class="w-full p-4 bg-white/50 backdrop-blur border border-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[#789c8a] transition resize-y" placeholder="What's on your mind?..." required></textarea>
                                </div>
                                
                                <div class="mb-8 p-5 bg-orange-50/50 backdrop-blur rounded-xl border border-orange-100">
                                    <label for="journal-private-notes" class="flex items-center gap-2 text-orange-700 font-bold mb-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                        Private Notes (Only for you)
                                    </label>
                                    <p class="text-sm text-orange-600/80 mb-3">Anything written here is mathematically stripped from the public feed. Only you will ever see this.</p>
                                    <textarea id="journal-private-notes" rows="4" class="w-full p-4 bg-white border-none rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-400 transition resize-y" placeholder="Add completely private reflections here..."></textarea>
                                </div>

                                <button type="submit" class="w-full py-4 bg-orange-500 text-white font-bold text-lg rounded-xl shadow-sm hover:bg-orange-600 transition-all hover:-translate-y-0.5">
                                    Publish Entry
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- RIGHT COLUMN: Feeds -->
                    <div class="lg:col-span-5 flex flex-col h-[85vh]">
                        <div class="flex flex-col gap-4 mb-4">
                            <div class="flex justify-between items-center mb-2">
                                <h2 class="text-xl font-bold font-['Lora',serif]">Feeds</h2>
                                <button id="find-students-btn" class="text-sm text-orange-500 font-bold hover:underline flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                    My Network
                                </button>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-1 relative">
                                    <input type="text" id="feed-search" class="w-full p-3 pl-10 bg-white/60 backdrop-blur border border-white rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-sm" placeholder="Search journals...">
                                    <svg class="w-5 h-5 text-stone-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                </div>
                                <select id="feed-sort" class="p-3 bg-white/60 backdrop-blur border border-white rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-stone-600 font-bold shadow-sm">
                                    <option value="newest">Newest First</option>
                                    <option value="oldest">Oldest First</option>
                                    <option value="popular">Most Liked</option>
                                </select>
                            </div>
                            <div class="flex gap-4">
                                <button id="tab-community" class="flex-1 py-3 text-center font-bold text-orange-600 bg-white/80 rounded-xl shadow-sm border border-white transition-all">Community Feed</button>
                                <button id="tab-my-entries" class="flex-1 py-3 text-center font-bold text-stone-500 hover:text-stone-700 hover:bg-white/50 rounded-xl transition-all border border-transparent">My Entries</button>
                            </div>
                        </div>
                        
                        <!-- Feed Container -->
                        <div class="flex-1 overflow-y-auto pb-8 pr-2 custom-scrollbar">
                            <div id="journal-feed-list" class="space-y-4">
                                <div class="text-center py-10 text-stone-500">Loading feed...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Network Modal (Instagram Style) -->
    <div id="find-students-modal" class="hidden fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg overflow-hidden transform transition-all border border-[#F0EBE1] flex flex-col h-[80vh] max-h-[600px]">
            <div class="p-6 border-b border-[#F0EBE1] flex justify-between items-center relative shrink-0">
                <h3 class="text-xl font-bold text-stone-800 font-['Lora',serif]">Network</h3>
                <button onclick="document.getElementById('find-students-modal').classList.add('hidden')" class="text-stone-400 hover:text-stone-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex border-b border-[#F0EBE1] shrink-0">
                <button id="tab-discover" class="flex-1 py-4 text-center font-bold text-orange-600 border-b-2 border-orange-500 transition-all">Discover</button>
                <button id="tab-following" class="flex-1 py-4 text-center font-bold text-stone-500 border-b-2 border-transparent hover:text-stone-700 transition-all">Following</button>
                <button id="tab-followers" class="flex-1 py-4 text-center font-bold text-stone-500 border-b-2 border-transparent hover:text-stone-700 transition-all">Followers</button>
            </div>

            <div class="p-6 flex flex-col flex-1 min-h-0">
                <div class="relative mb-6 shrink-0">
                    <input type="text" id="find-student-search" placeholder="Search..." class="w-full bg-[#FAF8F5] border-none rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-orange-500 outline-none text-stone-700">
                    <svg class="w-5 h-5 text-stone-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <h4 class="mb-4 text-sm font-bold text-stone-500 uppercase tracking-wider shrink-0" id="find-student-section-title">Suggested for you</h4>
                
                <div class="flex-1 overflow-y-auto custom-scrollbar pr-2">
                    <div id="students-list" class="space-y-4">
                        <p class="text-stone-500 text-center">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/global.js"></script>
    <script src="../js/journal.js"></script>
</body>
</html>
