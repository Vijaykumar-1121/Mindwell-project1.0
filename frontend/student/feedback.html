<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - MindWell</title>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
</head>
<body class="bg-stone-100">

    <div class="min-h-screen flex flex-col">
        <!-- Top Navigation -->
        <div id="global-header"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-stone-100 p-6">
            <div class="container mx-auto max-w-2xl">
                <div id="feedback-container" class="bg-white p-8 rounded-lg shadow-md">
                    <div id="feedback-form-content">
                        <div class="text-center mb-6">
                            <div class="inline-block bg-amber-100 p-3 rounded-full mb-4">
                                <svg class="w-8 h-8 text-amber-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.056 3 11.625c0 4.556 4.03 8.25 9 8.25Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 12.75h.008v.008H12v-.008Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 12.75h.008v.008H7.5v-.008Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75h.008v.008H16.5v-.008Z" />
                                </svg>
                            </div>
                            <h1 class="text-3xl font-bold text-stone-800">Share Your Feedback</h1>
                            <p class="text-stone-600 mt-2">Your insights help us improve MindWell for everyone.</p>
                        </div>
                        
                        <form id="feedback-form">
                            <div class="mb-4">
                                <label for="feedback-category" class="block text-stone-700 font-semibold mb-2">Category</label>
                                <select id="feedback-category" class="w-full p-3 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition bg-white" required>
                                    <option value="suggestion">Suggestion</option>
                                    <option value="technical-issue">Technical Issue</option>
                                    <option value="general-feedback">General Feedback</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="feedback-subject" class="block text-stone-700 font-semibold mb-2">Subject</label>
                                <input type="text" id="feedback-subject" class="w-full p-3 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition" placeholder="e.g., Suggestion for Journal Feature" required>
                            </div>
                            <div class="mb-6">
                                 <label for="feedback-message" class="block text-stone-700 font-semibold mb-2">Message</label>
                                <textarea id="feedback-message" rows="6" class="w-full p-3 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition" placeholder="Tell us more about your idea..." required></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-orange-500 text-white font-bold rounded-lg hover:bg-orange-600 transition">Submit Feedback</button>
                        </form>
                    </div>
                    <div id="feedback-confirmation" class="hidden text-center py-8">
                        <div class="inline-block bg-green-100 p-3 rounded-full mb-4">
                            <svg class="w-8 h-8 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                        </div>
                        <h2 class="text-2xl font-bold text-stone-800 mb-2">Thank You!</h2>
                        <p class="text-stone-600 mb-6">Your feedback has been received. We appreciate you taking the time to help us improve.</p>
                        <a href="dashboard.html" class="text-amber-600 hover:underline font-semibold">Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/global.js"></script>
    <script src="../js/forms.js"></script>
</body>
</html>
