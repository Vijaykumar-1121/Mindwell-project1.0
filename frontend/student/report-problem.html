<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Problem - MindWell</title>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
</head>
<body class="bg-stone-100">

    <div class="min-h-screen flex flex-col">
        <!-- Top Navigation -->
        <div id="global-header"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-stone-100 p-6">
            <div class="container mx-auto max-w-2xl">
                <div id="report-container" class="bg-white p-8 rounded-lg shadow-md">
                    <div id="report-form-content">
                        <div class="text-center mb-6">
                            <div class="inline-block bg-red-100 p-3 rounded-full mb-4">
                                <svg class="w-8 h-8 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.25-8.25-3.286Zm0 13.036h.008v.008H12v-.008Z" /></svg>
                            </div>
                            <h1 class="text-3xl font-bold text-stone-800">Report a Problem</h1>
                            <p class="text-stone-600 mt-2">Encountered an issue? Please let us know so we can fix it.</p>
                        </div>
                        
                        <form id="report-problem-form">
                             <div class="mb-4">
                                <label for="problem-category" class="block text-stone-700 font-semibold mb-2">Problem Area</label>
                                <select id="problem-category" class="w-full p-3 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition bg-white" required>
                                    <option value="login-issue">Login or Account Issue</option>
                                    <option value="dashboard-bug">Dashboard Bug</option>
                                    <option value="chat-problem">AI Assistant Problem</option>
                                    <option value="page-loading">Page Not Loading</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="problem-description" class="block text-stone-700 font-semibold mb-2">Description of the Problem</label>
                                <textarea id="problem-description" rows="5" class="w-full p-3 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition" placeholder="Please describe the issue in detail..." required></textarea>
                            </div>
                             <div class="mb-6">
                                <label for="problem-steps" class="block text-stone-700 font-semibold mb-2">Steps to Reproduce (if possible)</label>
                                <textarea id="problem-steps" rows="5" class="w-full p-3 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition" placeholder="e.g., 1. I clicked on the dashboard. 2. I tried to view my mood chart. 3. The page went blank."></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-red-500 text-white font-bold rounded-lg hover:bg-red-600 transition">Submit Report</button>
                        </form>
                    </div>
                     <div id="report-confirmation" class="hidden text-center py-8">
                        <div class="inline-block bg-green-100 p-3 rounded-full mb-4">
                            <svg class="w-8 h-8 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                        </div>
                        <h2 class="text-2xl font-bold text-stone-800 mb-2">Report Received</h2>
                        <p class="text-stone-600 mb-6">Thank you for your report. Our team will investigate the issue shortly.</p>
                        <a href="dashboard.html" class="text-amber-600 hover:underline font-semibold">Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/global.js"></script>
    <script src="../js/forms.js"></script>
</body>
</html>
