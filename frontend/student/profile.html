<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - MindWell</title>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Notification Toast */
        #notification {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            padding: 16px 24px; border-radius: 12px; color: white;
            opacity: 0; transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            pointer-events: none;
        }
        #notification.show { opacity: 1; transform: translateY(0); }
        #notification.success { background-color: #789c8a; } /* Sage Green */
        #notification.error { background-color: #e8a95c; } /* Amber */
        #notification.info { background-color: #8b9eb5; } /* Muted Blue */
    </style>
</head>
<body class="bg-[#FAF8F5] text-stone-800 font-['Nunito',sans-serif]">

    <div id="notification"></div>

    <div class="min-h-screen flex flex-col relative overflow-hidden">
        
        <!-- Decorative blur blobs -->
        <div class="fixed top-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-amber-100 rounded-full blur-[100px] opacity-40 pointer-events-none z-0"></div>
        <div class="fixed bottom-[-10%] left-[-5%] w-[30vw] h-[30vw] bg-orange-100 rounded-full blur-[100px] opacity-40 pointer-events-none z-0"></div>

        <!-- Top Navigation -->
        <div id="global-header"></div>

        <main class="flex-grow container mx-auto px-6 py-12 relative z-10 max-w-5xl">
            
            <div class="mb-10 text-center">
                <h1 class="text-4xl font-bold text-stone-800 font-['Lora',serif] mb-2">My Profile</h1>
                <p class="text-stone-500 text-lg">Manage your personal information and preferences.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                
                <!-- Left Sidebar: Profile Summary & Avatar Upload -->
                <div class="md:col-span-1">
                    <div class="bg-white/60 backdrop-blur-xl p-8 rounded-3xl shadow-sm border border-white text-center sticky top-28">
                        
                        <div class="relative w-32 h-32 mx-auto mb-6 group cursor-pointer" onclick="document.getElementById('avatar-upload').click()">
                            <!-- Avatar Display -->
                            <div id="profile-avatar-display" class="w-full h-full rounded-full border-4 border-white shadow-md bg-stone-200 overflow-hidden flex items-center justify-center text-stone-400">
                                <svg class="w-24 h-24 mt-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            </div>
                            <!-- Upload Overlay -->
                            <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </div>
                            <input type="file" id="avatar-upload" class="hidden" accept="image/*">
                        </div>

                        <h2 id="display-name" class="text-2xl font-bold text-stone-800 font-['Lora',serif] mb-1">Loading...</h2>
                        <p id="display-username" class="text-stone-500 text-sm font-semibold mb-4">@loading</p>
                        
                        <div id="display-bio" class="text-stone-600 text-sm italic mb-6"></div>
                        
                        <div class="pt-6 border-t border-[#F0EBE1]">
                            <p class="text-xs text-stone-400 uppercase tracking-widest font-bold mb-1">Member Since</p>
                            <p id="display-join-date" class="text-stone-700 font-semibold text-sm">--</p>
                        </div>
                    </div>
                </div>

                <!-- Right Side: Edit Form -->
                <div class="md:col-span-2">
                    <form id="profile-form" class="space-y-8">
                        
                        <!-- General Info -->
                        <div class="bg-white/60 backdrop-blur-xl p-8 rounded-3xl shadow-sm border border-white">
                            <h3 class="text-xl font-bold text-stone-800 font-['Lora',serif] mb-6">General Information</h3>
                            <div class="space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-sm font-bold text-stone-600 mb-2">Full Name</label>
                                        <input type="text" id="input-name" class="w-full px-4 py-3 bg-[#FAF8F5] border border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400 transition text-stone-700" required>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-stone-600 mb-2">Username</label>
                                        <input type="text" id="input-username" class="w-full px-4 py-3 bg-[#FAF8F5] border border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400 transition text-stone-700" required>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-stone-600 mb-2">Email Address</label>
                                    <input type="email" id="input-email" class="w-full px-4 py-3 bg-[#FAF8F5] border border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400 transition text-stone-700" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-stone-600 mb-2">Short Bio</label>
                                    <textarea id="input-bio" rows="3" class="w-full px-4 py-3 bg-[#FAF8F5] border border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400 transition text-stone-700 resize-none" placeholder="Tell us a bit about yourself..."></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end sticky bottom-6 mt-8">
                            <button type="submit" id="save-btn" class="bg-stone-800 text-white font-bold py-4 px-10 rounded-full hover:bg-stone-700 transition shadow-xl hover:-translate-y-0.5 flex items-center gap-2 text-lg">
                                <span>Save All Changes</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <!-- Cropper Modal -->
    <div id="crop-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[10000] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl">
            <h3 class="text-xl font-bold font-['Lora',serif] mb-4 text-stone-800">Crop Profile Picture</h3>
            <div class="w-full h-80 bg-stone-100 rounded-xl overflow-hidden mb-6 flex items-center justify-center">
                <img id="crop-image" src="" class="max-w-full max-h-full block">
            </div>
            <div class="flex justify-end gap-4">
                <button id="cancel-crop-btn" class="px-6 py-2.5 rounded-full text-stone-500 font-bold hover:bg-stone-100 transition">Cancel</button>
                <button id="confirm-crop-btn" class="px-6 py-2.5 rounded-full bg-orange-500 text-white font-bold hover:bg-orange-600 transition shadow-sm hover:-translate-y-0.5">Crop & Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
