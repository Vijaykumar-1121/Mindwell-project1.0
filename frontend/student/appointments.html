<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - MindWell</title>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Notification Toast */
        #notification {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            padding: 16px 24px; border-radius: 12px; color: white;
            opacity: 0; transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            pointer-events: none;
        }
        #notification.show { opacity: 1; transform: translateY(0); }
        #notification.success { background-color: #789c8a; } /* Sage Green */
        #notification.error { background-color: #e8a95c; } /* Amber */
        #notification.info { background-color: #8b9eb5; } /* Muted Blue */
    </style>
</head>
<body class="bg-[#FAF8F5] text-stone-800 font-['Nunito',sans-serif]">

    <div id="notification"></div>

    <div class="min-h-screen flex flex-col relative overflow-hidden">
        
        <!-- Decorative blur blobs -->
        <div class="fixed top-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-orange-100 rounded-full blur-[100px] opacity-40 pointer-events-none z-0"></div>
        <div class="fixed bottom-[-10%] left-[-5%] w-[30vw] h-[30vw] bg-stone-200 rounded-full blur-[100px] opacity-40 pointer-events-none z-0"></div>

        <!-- Top Navigation -->
        <div id="global-header"></div>

        <main class="flex-grow container mx-auto px-6 py-8 relative z-10">
            <!-- Header Section -->
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h1 class="text-4xl font-bold text-stone-800 font-['Lora',serif] mb-2">Your Appointments</h1>
                    <p class="text-stone-500 text-lg">Manage your counseling sessions.</p>
                </div>
                <a href="book-appointment.html" class="hidden sm:inline-block bg-orange-500 text-white font-bold py-3 px-6 rounded-full hover:bg-orange-600 transition shadow-md hover:-translate-y-0.5">
                    + Book New Session
                </a>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Main Content (Upcoming & Past) -->
                <div class="lg:col-span-2 space-y-8">
                    
                    <!-- Upcoming Sessions -->
                    <div class="bg-white/60 backdrop-blur-xl p-8 rounded-3xl shadow-sm border border-white relative overflow-hidden">
                        <h2 class="text-2xl font-bold text-stone-800 mb-6 font-['Lora',serif] flex justify-between items-center relative z-10">
                            Upcoming Sessions
                            <a href="book-appointment.html" class="sm:hidden text-sm text-orange-500 hover:underline">+ Book</a>
                        </h2>
                        <div id="upcoming-appointments-list" class="space-y-4 relative z-10">
                            <!-- Dynamic Content -->
                        </div>
                    </div>

                    <!-- Past Sessions -->
                    <div class="bg-white/60 backdrop-blur-xl p-8 rounded-3xl shadow-sm border border-white relative overflow-hidden">
                        <h2 class="text-2xl font-bold text-stone-800 mb-6 font-['Lora',serif] relative z-10">Past Sessions</h2>
                        <div id="past-appointments-list" class="space-y-4 relative z-10">
                             <!-- Dynamic Content -->
                        </div>
                    </div>

                </div>

                <!-- Sidebar (Featured Counselors) -->
                <div class="space-y-6">
                    <div class="bg-white/60 backdrop-blur-xl p-8 rounded-3xl shadow-sm border border-white">
                        <h3 class="text-xl font-bold text-stone-800 mb-6 font-['Lora',serif]">Available Professionals</h3>
                        <div id="featured-counselors-list" class="space-y-6">
                            <!-- Dynamic Content -->
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/global.js"></script>
    <script src="../js/appointments.js"></script>
</body>
</html>
