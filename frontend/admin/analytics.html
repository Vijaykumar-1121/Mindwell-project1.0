<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Admin Dashboard</title>
    <script src="../js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-stone-100">

    <div class="flex h-screen">
        <!-- Admin Sidebar Navigation -->
        <aside class="w-64 bg-stone-800 text-stone-300 flex-shrink-0 flex flex-col">
            <div class="p-6 border-b border-stone-700">
                <a href="dashboard.html" class="flex items-center gap-2 text-2xl font-bold text-white">
                    <img src="/assets/icons/logo.svg" alt="MindWell Logo" class="h-8">
                    MindWell
                </a>
            </div>
            <nav class="mt-4 flex-grow p-2">
                <a href="dashboard.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-stone-700 hover:text-white transition-colors duration-200">
                    <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    Dashboard
                </a>
                <a href="analytics.html" class="flex items-center px-4 py-3 text-white bg-stone-700/50 rounded-lg font-semibold">
                    <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    Analytics
                </a>
                <a href="manage-users.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-stone-700 hover:text-white transition-colors duration-200">
                    <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/></svg>
                    Manage Users
                </a>
                <a href="manage-counselors.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-stone-700 hover:text-white transition-colors duration-200">
                    <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    Manage Counselors
                </a>
                 <a href="manage-resources.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-stone-700 hover:text-white transition-colors duration-200">
                    <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                    Manage Resources
                </a>
            </nav>
            <div class="p-4 border-t border-stone-700">
                 <a href="../index.html" class="flex items-center px-4 py-3 rounded-lg hover:bg-stone-700 hover:text-white transition-colors duration-200" id="logout-btn">
                    <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm border-b border-stone-200">
                <div class="container mx-auto px-8 py-5 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-stone-800">Advanced Analytics</h1>
                    <div id="analytics-last-updated" class="text-sm font-semibold text-stone-500 bg-stone-100 px-4 py-2 rounded-full"></div>
                </div>
            </header>
            
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-stone-50 p-8">
                <div class="max-w-7xl mx-auto space-y-8">
                    
                    <!-- Top Chart Row -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                            <h3 class="text-lg font-bold text-stone-800 mb-6 flex items-center justify-between">
                                User Growth (YTD)
                                <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full">+12% from last month</span>
                            </h3>
                            <div class="h-[300px] w-full"><canvas id="analyticsGrowthChart"></canvas></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                            <h3 class="text-lg font-bold text-stone-800 mb-6 flex items-center justify-between">
                                Campus Mood Distribution
                                <span class="text-xs font-semibold text-stone-500 bg-stone-100 px-2 py-1 rounded-full">Last 30 Days</span>
                            </h3>
                            <div class="h-[300px] w-full flex justify-center"><canvas id="analyticsMoodPieChart"></canvas></div>
                        </div>
                    </div>

                    <!-- Bottom Chart Row -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                        <h3 class="text-lg font-bold text-stone-800 mb-6">Counselor Appointment Volume</h3>
                        <div class="h-[350px] w-full"><canvas id="analyticsAppointmentsChart"></canvas></div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- Analytics logic gets appended to admin-dashboard.js or defined here. For simplicity, we define specific charts inline or let admin-dashboard.js handle it if it detects them. -->
    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
